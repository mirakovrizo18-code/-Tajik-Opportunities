# ============================================================
# 🇹🇯 TAJIK OPPORTUNITIES
# CLOUDFLARE WORKERS CONFIGURATION
# Version: 2026.09.09 POWER PRODUCTION
# ============================================================

name = "tajik-opportunities"

main = "src/index.ts"

compatibility_date = "2026-09-09"

workers_dev = true


# ============================================================
# ENVIRONMENT
# ============================================================

[vars]

ENVIRONMENT = "production"

APP_NAME = "Tajik Opportunities"

APP_VERSION = "2026.09.09"

DEFAULT_LANGUAGE = "ru"

SUPPORTED_LANGUAGES = "ru,tg,en,uz"

API_VERSION = "1"

CORS_ORIGIN = "*"

CORS_METHODS = "GET,POST,PUT,PATCH,DELETE,OPTIONS"

CORS_HEADERS = "Content-Type,Authorization,X-Request-ID,X-CSRF-Token,X-Visitor-ID,X-Session-ID,X-Client-Version,X-Admin-Session"


# ============================================================
# STATIC ASSETS
# ============================================================

[assets]

directory = "./public"


# ============================================================
# D1 DATABASE
# ============================================================

[[d1_databases]]

binding = "DB"

database_name = "tajik-opportunities-db"

database_id = "b016bf09-3048-4410-b273-5f13c2a0430e"


# ============================================================
# R2 MEDIA STORAGE
# ============================================================
#
# ВАЖНО:
# Сначала создай R2 bucket в Cloudflare с именем:
#
# tajik-opportunities-media
#
# После создания bucket эта секция подключит его к Worker.
#
# R2 будет использоваться для:
# • фотографий
# • видео
# • голосовых сообщений
# • аудио
# • документов
# • файлов публикаций
# • файлов чата
# • аватаров
# • медиа профилей
# • вложений администратора
#
# ============================================================

[[r2_buckets]]

binding = "MEDIA"

bucket_name = "tajik-opportunities-media"


# ============================================================
# DEVELOPMENT
# ============================================================

[dev]

local_protocol = "http"

ip = "127.0.0.1"

port = 8787


# ============================================================
# OBSERVABILITY
# ============================================================

[observability]

enabled = true


# ============================================================
# LOGGING
# ============================================================

[observability.logs]

enabled = true

invocation_logs = true


# ============================================================
# PLACEMENT
# ============================================================

[placement]

mode = "smart"


# ============================================================
# ROUTES
# ============================================================
#
# Основной Worker работает на workers.dev.
#
# Когда подключишь собственный домен:
#
# routes = [
#   { pattern = "example.com/*", zone_name = "example.com" }
# ]
#
# Не включаем это сейчас, чтобы не сломать deploy.
#
# ============================================================


# ============================================================
# FEATURE FLAGS
# ============================================================

[vars.FEATURE_PUBLICATIONS]

enabled = "true"


[vars.FEATURE_COMMENTS]

enabled = "true"


[vars.FEATURE_REVIEWS]

enabled = "true"


[vars.FEATURE_REACTIONS]

enabled = "true"


[vars.FEATURE_SHARES]

enabled = "true"


[vars.FEATURE_BOOKMARKS]

enabled = "true"


[vars.FEATURE_CHAT]

enabled = "true"


[vars.FEATURE_NOTIFICATIONS]

enabled = "true"


[vars.FEATURE_ADMIN_PANEL]

enabled = "true"


[vars.FEATURE_PROFILES]

enabled = "true"


[vars.FEATURE_SEARCH]

enabled = "true"


[vars.FEATURE_LEVELS]

enabled = "true"


[vars.FEATURE_PREMIUM]

enabled = "true"


[vars.FEATURE_PRO]

enabled = "true"


[vars.FEATURE_TOP]

enabled = "true"


[vars.FEATURE_VIP]

enabled = "true"


[vars.FEATURE_REPORTS]

enabled = "true"


[vars.FEATURE_ANALYTICS]

enabled = "true"


[vars.FEATURE_MEDIA]

enabled = "true"


[vars.FEATURE_SHARING]

enabled = "true"


# ============================================================
# SECURITY
# ============================================================

[vars.SECURITY]

enabled = "true"


# ============================================================
# END
# ============================================================
