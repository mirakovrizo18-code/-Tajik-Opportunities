<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Уведомления — Tajik Opportunities</title>
  <meta name="description" content="Уведомления Tajik Opportunities">

  <link rel="icon" type="image/jpeg" href="/images/Image_2026_09_05_19_01_30.jpg">
  <link rel="stylesheet" href="/css/style.css">

  <style>
    .notifications-page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px 100px;
    }

    .notifications-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .notifications-title {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
    }

    .notifications-subtitle {
      margin: 6px 0 0;
      opacity: .7;
      font-size: 14px;
    }

    .notifications-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .notifications-actions button {
      border: 0;
      cursor: pointer;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
    }

    .notifications-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 24px;
      padding: 0 7px;
      border-radius: 999px;
      font-size: 12px;
      background: #e53935;
      color: #fff;
      vertical-align: middle;
      margin-left: 6px;
    }

    .notifications-login {
      padding: 22px;
      border-radius: 16px;
      text-align: center;
      background: rgba(127,127,127,.08);
      margin-bottom: 16px;
    }

    .notifications-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .notification-item {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px;
      border-radius: 16px;
      background: var(--card-bg, #fff);
      border: 1px solid rgba(127,127,127,.15);
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    .notification-item:hover {
      transform: translateY(-1px);
      background: rgba(127,127,127,.06);
    }

    .notification-item.unread {
      border-left: 4px solid #1976d2;
      background: rgba(25,118,210,.07);
    }

    .notification-icon {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      background: rgba(127,127,127,.12);
    }

    .notification-body {
      flex: 1;
      min-width: 0;
    }

    .notification-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .notification-text {
      font-size: 14px;
      line-height: 1.5;
      opacity: .85;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .notification-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      opacity: .6;
      flex-wrap: wrap;
    }

    .notification-official {
      font-weight: 800;
      opacity: 1;
    }

    .notification-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #1976d2;
      margin-top: 8px;
      flex-shrink: 0;
    }

    .notifications-empty {
      text-align: center;
      padding: 60px 20px;
      border-radius: 18px;
      background: rgba(127,127,127,.06);
    }

    .notifications-empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .notifications-empty-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .notifications-empty-text {
      opacity: .65;
      font-size: 14px;
    }

    .notifications-loading {
      text-align: center;
      padding: 40px 20px;
      opacity: .7;
    }

    .notifications-error {
      padding: 16px;
      border-radius: 14px;
      background: rgba(229,57,53,.1);
      color: #c62828;
      margin-bottom: 15px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      padding: 12px 18px;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-size: 14px;
      transition: .25s ease;
      max-width: calc(100vw - 30px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 700px) {
      .notifications-page {
        padding: 18px 12px 90px;
      }

      .notifications-title {
        font-size: 24px;
      }

      .notifications-head {
        align-items: flex-start;
      }

      .notifications-actions {
        width: 100%;
      }

      .notifications-actions button {
        flex: 1;
      }

      .notification-item {
        padding: 13px;
        gap: 10px;
      }

      .notification-icon {
        width: 40px;
        height: 40px;
        min-width: 40px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">

      <a href="/" class="brand">
        <img
          src="/images/Image_2026_09_05_19_01_30.jpg"
          alt="Tajik Opportunities"
          class="brand-logo"
        >
        <span class="brand-name">Tajik Opportunities</span>
      </a>

      <nav class="desktop-nav">
        <a href="/">Главная</a>
        <a href="/#search">Поиск</a>
        <a href="/#categories">Категории</a>
        <a href="/add.html">Создать</a>

        <a href="/notifications.html" class="active">
          🔔
          <span id="headerUnreadCount" class="notifications-count" style="display:none;">0</span>
        </a>

        <a href="/profile.html">👤</a>
      </nav>

    </div>
  </header>


  <!-- MAIN -->
  <main class="notifications-page">

    <div class="notifications-head">

      <div>
        <h1 class="notifications-title">
          🔔 Уведомления
          <span
            id="pageUnreadCount"
            class="notifications-count"
            style="display:none;"
          >0</span>
        </h1>

        <p class="notifications-subtitle">
          Новости, сообщения и события вашего аккаунта
        </p>
      </div>

      <div class="notifications-actions">

        <button
          type="button"
          id="markAllButton"
        >
          ✓ Прочитать все
        </button>

        <button
          type="button"
          id="refreshButton"
        >
          ↻ Обновить
        </button>

      </div>

    </div>


    <!-- LOGIN STATE -->
    <div
      id="loginState"
      class="notifications-login"
      style="display:none;"
    >
      <div style="font-size:32px;margin-bottom:10px;">🔐</div>

      <strong>Войдите в аккаунт</strong>

      <p style="opacity:.7;margin:8px 0 15px;">
        После входа здесь будут отображаться ваши уведомления.
      </p>

      <a href="/profile.html" class="button">
        Войти / зарегистрироваться
      </a>
    </div>


    <!-- ERROR -->
    <div
      id="notificationsError"
      class="notifications-error"
      style="display:none;"
    ></div>


    <!-- APPLICATION -->
    <section
      id="notificationsApp"
      style="display:none;"
    >

      <div
        id="notificationsList"
        class="notifications-list"
      ></div>

    </section>

  </main>


  <!-- MOBILE NAV -->
  <nav class="mobile-bottom-nav">

    <a href="/">
      <span>🏠</span>
      <small>Главная</small>
    </a>

    <a href="/saved.html">
      <span>🔖</span>
      <small>Сохранённые</small>
    </a>

    <a href="/add.html">
      <span>➕</span>
      <small>Создать</small>
    </a>

    <a href="/messages.html">
      <span>💬</span>
      <small>Сообщения</small>
    </a>

    <a href="/profile.html">
      <span>👤</span>
      <small>Профиль</small>
    </a>

  </nav>


  <!-- TOAST -->
  <div id="toast" class="toast"></div>


  <script>
    (() => {

      "use strict";

      const API = {
        me: "/api/auth/me",
        notifications: "/api/notifications",
        read: "/api/notifications/read"
      };


      const elements = {
        app: document.getElementById("notificationsApp"),
        list: document.getElementById("notificationsList"),
        loginState: document.getElementById("loginState"),
        error: document.getElementById("notificationsError"),
        headerUnread: document.getElementById("headerUnreadCount"),
        pageUnread: document.getElementById("pageUnreadCount"),
        markAll: document.getElementById("markAllButton"),
        refresh: document.getElementById("refreshButton"),
        toast: document.getElementById("toast")
      };


      let currentUser = null;
      let notifications = [];
      let loading = false;
      let toastTimer = null;


      function showToast(message) {

        if (!elements.toast) return;

        elements.toast.textContent = message;
        elements.toast.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {
          elements.toast.classList.remove("show");
        }, 2500);
      }


      function showError(message) {

        if (!elements.error) return;

        elements.error.textContent = message || "Произошла ошибка.";
        elements.error.style.display = "block";
      }


      function hideError() {

        if (!elements.error) return;

        elements.error.style.display = "none";
      }


      async function request(url, options = {}) {

        const response = await fetch(url, {
          credentials: "same-origin",
          ...options,
          headers: {
            "Accept": "application/json",
            ...(options.body ? {
              "Content-Type": "application/json"
            } : {}),
            ...(options.headers || {})
          }
        });

        let data = null;

        try {
          data = await response.json();
        } catch (_) {
          data = null;
        }

        if (!response.ok) {

          const error = new Error(
            data?.error ||
            data?.message ||
            `Ошибка ${response.status}`
          );

          error.status = response.status;

          throw error;
        }

        return data || {};
      }


      async function loadCurrentUser() {

        try {

          const data = await request(API.me);

          currentUser =
            data?.user ||
            data?.profile ||
            data ||
            null;

          return currentUser;

        } catch (error) {

          currentUser = null;

          if (error.status === 401 || error.status === 403) {
            return null;
          }

          throw error;
        }
      }


      function getNotificationId(item) {

        return (
          item?.id ??
          item?.notification_id ??
          item?.notificationId ??
          null
        );
      }


      function isUnread(item) {

        return !(
          item?.read === true ||
          item?.is_read === true ||
          item?.read_at
        );
      }


      function getUnreadCount() {

        const serverCount =
          notifications?.unread_count ??
          notifications?.unreadCount;

        if (typeof serverCount === "number") {
          return serverCount;
        }

        return notifications.filter(isUnread).length;
      }


      function updateCounters() {

        const count = getUnreadCount();

        if (elements.headerUnread) {

          elements.headerUnread.textContent = count;

          elements.headerUnread.style.display =
            count > 0 ? "inline-flex" : "none";
        }


        if (elements.pageUnread) {

          elements.pageUnread.textContent = count;

          elements.pageUnread.style.display =
            count > 0 ? "inline-flex" : "none";
        }

      }


      function notificationIcon(item) {

        const type = String(
          item?.type ||
          item?.notification_type ||
          item?.kind ||
          ""
        ).toLowerCase();


        if (
          type.includes("message") ||
          type.includes("chat")
        ) {
          return "💬";
        }


        if (
          type.includes("comment") ||
          type.includes("reply")
        ) {
          return "💭";
        }


        if (
          type.includes("like") ||
          type.includes("reaction")
        ) {
          return "❤️";
        }


        if (
          type.includes("follow") ||
          type.includes("subscriber")
        ) {
          return "👤";
        }


        if (
          type.includes("publication") ||
          type.includes("post")
        ) {
          return "📢";
        }


        if (
          type.includes("admin") ||
          type.includes("system") ||
          type.includes("official")
        ) {
          return "🇹🇯";
        }


        return "🔔";
      }


      function escapeHTML(value) {

        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }


      function formatDate(value) {

        if (!value) return "";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return String(value);
        }

        return new Intl.DateTimeFormat(
          "ru-RU",
          {
            dateStyle: "medium",
            timeStyle: "short"
          }
        ).format(date);
      }


      function getSender(item) {

        const sender =
          item?.sender_name ||
          item?.author_name ||
          item?.from_name ||
          item?.actor_name ||
          item?.sender?.name ||
          item?.author?.name ||
          "";


        const official =
          item?.is_official === true ||
          item?.official === true ||
          item?.sender_type === "admin" ||
          item?.sender_type === "official" ||
          String(item?.type || "").toLowerCase().includes("admin");


        if (official) {
          return "🇹🇯 Tajik Opportunities✅";
        }


        return sender;
      }


      function getTitle(item) {

        return (
          item?.title ||
          item?.subject ||
          item?.notification_title ||
          item?.message_title ||
          "Новое уведомление"
        );
      }


      function getText(item) {

        return (
          item?.message ||
          item?.text ||
          item?.body ||
          item?.content ||
          item?.description ||
          ""
        );
      }


      function getTarget(item) {

        const direct =
          item?.url ||
          item?.link ||
          item?.href ||
          item?.target_url ||
          item?.targetUrl;


        if (direct) {
          return direct;
        }


        const publicationId =
          item?.publication_id ||
          item?.publicationId ||
          item?.post_id ||
          item?.postId;


        if (publicationId) {
          return `/post.html?id=${encodeURIComponent(publicationId)}`;
        }


        const conversationId =
          item?.conversation_id ||
          item?.conversationId ||
          item?.chat_id ||
          item?.chatId;


        if (conversationId) {
          return `/messages.html?conversation_id=${encodeURIComponent(conversationId)}`;
        }


        const type = String(
          item?.type ||
          item?.notification_type ||
          ""
        ).toLowerCase();


        if (
          type.includes("message") ||
          type.includes("chat")
        ) {
          return "/messages.html";
        }


        return "";
      }


      function renderEmpty() {

        elements.list.innerHTML = `
          <div class="notifications-empty">
            <div class="notifications-empty-icon">🔔</div>
            <div class="notifications-empty-title">
              Уведомлений пока нет
            </div>
            <div class="notifications-empty-text">
              Здесь появятся новые сообщения, события и обновления.
            </div>
          </div>
        `;
      }


      function renderNotifications() {

        if (!elements.list) return;


        if (!notifications.length) {

          renderEmpty();
          updateCounters();

          return;
        }


        elements.list.innerHTML = notifications.map((item) => {

          const id = getNotificationId(item);
          const unread = isUnread(item);

          const sender = getSender(item);
          const title = getTitle(item);
          const text = getText(item);
          const date = formatDate(
            item?.created_at ||
            item?.createdAt ||
            item?.date ||
            item?.timestamp
          );


          return `
            <article
              class="notification-item ${unread ? "unread" : ""}"
              data-id="${escapeHTML(id ?? "")}"
              data-url="${escapeHTML(getTarget(item))}"
            >

              <div class="notification-icon">
                ${notificationIcon(item)}
              </div>

              <div class="notification-body">

                <div class="notification-title">
                  ${escapeHTML(title)}
                </div>

                ${
                  text
                    ? `<div class="notification-text">${escapeHTML(text)}</div>`
                    : ""
                }

                <div class="notification-meta">

                  ${
                    sender
                      ? `<span class="notification-official">${escapeHTML(sender)}</span>`
                      : ""
                  }

                  ${
                    sender && date
                      ? `<span>•</span>`
                      : ""
                  }

                  ${
                    date
                      ? `<span>${escapeHTML(date)}</span>`
                      : ""
                  }

                </div>

              </div>

              ${
                unread
                  ? `<span class="notification-dot" title="Новое"></span>`
                  : ""
              }

            </article>
          `;

        }).join("");


        updateCounters();
      }


      async function loadNotifications(options = {}) {

        if (loading) return;

        loading = true;

        hideError();


        if (!options.silent) {

          elements.list.innerHTML = `
            <div class="notifications-loading">
              ⏳ Загрузка уведомлений...
            </div>
          `;
        }


        try {

          const data = await request(API.notifications);


          notifications =
            Array.isArray(data)
              ? data
              : (
                  data?.notifications ||
                  data?.items ||
                  data?.data ||
                  []
                );


          renderNotifications();


        } catch (error) {

          console.error(error);

          if (error.status === 401 || error.status === 403) {

            currentUser = null;

            elements.app.style.display = "none";
            elements.loginState.style.display = "block";

            return;
          }


          showError(
            error.message ||
            "Не удалось загрузить уведомления."
          );


          elements.list.innerHTML = `
            <div class="notifications-empty">
              <div class="notifications-empty-icon">⚠️</div>

              <div class="notifications-empty-title">
                Не удалось загрузить уведомления
              </div>

              <div class="notifications-empty-text">
                Попробуйте обновить страницу.
              </div>
            </div>
          `;

        } finally {

          loading = false;
        }
      }


      async function markAsRead(id, item) {

        if (!id) return;


        try {

          await request(API.read, {
            method: "POST",
            body: JSON.stringify({
              notification_id: id
            })
          });


          if (item) {

            item.read = true;
            item.is_read = true;
            item.read_at = new Date().toISOString();
          }


        } catch (error) {

          console.error(
            "Не удалось отметить уведомление:",
            error
          );
        }
      }


      async function markAllAsRead() {

        const unreadItems =
          notifications.filter(isUnread);


        if (!unreadItems.length) {

          showToast("Все уведомления уже прочитаны.");

          return;
        }


        elements.markAll.disabled = true;


        try {

          /*
           * Новый Worker не имеет /api/notifications/read-all.
           * Поэтому отмечаем каждое уведомление отдельным запросом.
           */

          await Promise.all(
            unreadItems.map((item) =>
              markAsRead(
                getNotificationId(item),
                item
              )
            )
          );


          notifications.forEach((item) => {

            item.read = true;
            item.is_read = true;
            item.read_at =
              item.read_at ||
              new Date().toISOString();

          });


          renderNotifications();

          showToast("Все уведомления прочитаны.");

        } finally {

          elements.markAll.disabled = false;
        }
      }


      async function handleNotificationClick(event) {

        const itemElement =
          event.target.closest(".notification-item");


        if (!itemElement) return;


        const id =
          itemElement.dataset.id;


        const item =
          notifications.find(
            notification =>
              String(getNotificationId(notification)) ===
              String(id)
          );


        if (item && isUnread(item)) {
          await markAsRead(id, item);
          renderNotifications();
        }


        const target =
          itemElement.dataset.url;


        if (!target) return;


        if (
          target.startsWith("/") &&
          !target.startsWith("//")
        ) {
          window.location.href = target;
          return;
        }


        try {

          const url = new URL(
            target,
            window.location.origin
          );


          if (url.origin === window.location.origin) {
            window.location.href =
              url.pathname +
              url.search +
              url.hash;
          }

        } catch (_) {
          // Некорректная ссылка — ничего не делаем.
        }
      }


      async function init() {

        try {

          const user =
            await loadCurrentUser();


          if (!user) {

            elements.app.style.display = "none";
            elements.loginState.style.display = "block";

            return;
          }


          elements.loginState.style.display = "none";
          elements.app.style.display = "block";


          await loadNotifications();

        } catch (error) {

          console.error(error);

          showError(
            error.message ||
            "Не удалось загрузить страницу."
          );

        }
      }


      elements.markAll?.addEventListener(
        "click",
        markAllAsRead
      );


      elements.refresh?.addEventListener(
        "click",
        () => loadNotifications()
      );


      elements.list?.addEventListener(
        "click",
        handleNotificationClick
      );


      init();


      /*
       * Автоматически проверяем новые уведомления
       * примерно каждые 10 секунд.
       */

      setInterval(() => {

        if (
          currentUser &&
          document.visibilityState === "visible"
        ) {
          loadNotifications({
            silent: true
          });
        }

      }, 10000);


      /*
       * При возвращении пользователя на вкладку
       * сразу обновляем уведомления.
       */

      document.addEventListener(
        "visibilitychange",
        () => {

          if (
            document.visibilityState === "visible" &&
            currentUser
          ) {
            loadNotifications({
              silent: true
            });
          }

        }
      );

    })();
  </script>

</body>
</html>
