# ============================================================
# 🇹🇯 TAJIK OPPORTUNITIES
# CLOUDFLARE WORKERS CONFIGURATION
# Version: 2026.09.09 FREE PRODUCTION
# ============================================================

# ------------------------------------------------------------
# WORKER
# ------------------------------------------------------------

name = "tajik-opportunities"
main = "src/index.ts"
compatibility_date = "2026-09-09"
workers_dev = true

# ------------------------------------------------------------
# ENVIRONMENT VARIABLES
# ------------------------------------------------------------

[vars]

ENVIRONMENT = "production"
APP_NAME = "Tajik Opportunities"
APP_VERSION = "2026.09.09"

DEFAULT_LANGUAGE = "ru"
SUPPORTED_LANGUAGES = "ru,tg,en,uz"

API_VERSION = "1"

CORS_ORIGIN = "*"
CORS_METHODS = "GET,POST,PUT,PATCH,DELETE,OPTIONS"
CORS_HEADERS = "Content-Type,Authorization,X-Request-ID,X-CSRF-Token,X-Visitor-ID,X-Session-ID,X-Client-Version,X-Admin-Session"

# ------------------------------------------------------------
# FEATURE FLAGS
# ------------------------------------------------------------

FEATURE_PUBLICATIONS = "true"
FEATURE_COMMENTS = "true"
FEATURE_REVIEWS = "true"
FEATURE_REACTIONS = "true"
FEATURE_SHARES = "true"
FEATURE_BOOKMARKS = "true"

FEATURE_CHAT = "true"
FEATURE_NOTIFICATIONS = "true"
FEATURE_ADMIN_PANEL = "true"
FEATURE_PROFILES = "true"
FEATURE_SEARCH = "true"

FEATURE_LEVELS = "true"
FEATURE_PREMIUM = "true"
FEATURE_PRO = "true"
FEATURE_TOP = "true"
FEATURE_VIP = "true"

FEATURE_REPORTS = "true"
FEATURE_ANALYTICS = "true"

FEATURE_MEDIA = "true"
FEATURE_SHARING = "true"

# Security feature flag
SECURITY = "true"

# ------------------------------------------------------------
# STATIC ASSETS
# ------------------------------------------------------------

# Static files are served from ./public.
# Cloudflare R2 is NOT used.

[assets]

directory = "./public"

# ------------------------------------------------------------
# D1 DATABASE
# ------------------------------------------------------------

[[d1_databases]]

binding = "DB"
database_name = "tajik-opportunities-db"
database_id = "b016bf09-3048-4410-b273-5f13c2a0430e"

# ------------------------------------------------------------
# DEVELOPMENT
# ------------------------------------------------------------

[dev]

local_protocol = "http"
ip = "127.0.0.1"
port = 8787

# ------------------------------------------------------------
# OBSERVABILITY
# ------------------------------------------------------------

[observability]

enabled = true

[observability.logs]

enabled = true
invocation_logs = true

# ------------------------------------------------------------
# PLACEMENT
# ------------------------------------------------------------

[placement]

mode = "smart"

# ------------------------------------------------------------
# MEDIA
# ------------------------------------------------------------

# R2 is intentionally NOT configured.
#
# Media files use external URLs:
#
# https://example.com/photo.jpg
# https://example.com/video.mp4
#
# The application stores URLs rather than binary files.
#
# No:
# - R2Bucket
# - env.MEDIA
# - tajik-opportunities-media
#
# ------------------------------------------------------------
# ROUTES
# ------------------------------------------------------------

# The project currently uses workers.dev.
# No custom domain is configured.

# Example for a future custom domain:
#
# routes = [
#   { pattern = "example.com/*", zone_name = "example.com" }
# ]

# ============================================================
# END
# ============================================================
#
# Architecture:
#
# Worker
# ├── D1 Database
# └── Static Assets
#
# Media
# └── External URLs
#
# R2
# └── NOT USED
#
# ============================================================
