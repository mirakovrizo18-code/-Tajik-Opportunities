# ============================================================
# TAJIK OPPORTUNITIES — CLOUDFLARE WORKERS
# ============================================================

name = "tajik-opportunities"
main = "worker/worker.js"

compatibility_date = "2026-09-05"
compatibility_flags = ["nodejs_compat"]

# ============================================================
# ОСНОВНЫЕ ПЕРЕМЕННЫЕ
# ============================================================

[vars]
ENVIRONMENT = "production"
API_VERSION = "v1"
SITE_URL = "https://tajik-opportunities.com"
SITE_NAME = "Tajik Opportunities"
DEFAULT_LANGUAGE = "ru"
TIMEZONE = "Asia/Dushanbe"

# ============================================================
# СТАТИЧЕСКИЙ САЙТ
# ============================================================

[assets]
directory = "./public"
binding = "ASSETS"

# ============================================================
# CLOUDFLARE D1 DATABASE
# ============================================================

[[d1_databases]]
binding = "DB"
database_name = "tajik-opportunities-db"
database_id = "b016bf09-3048-4410-b273-5f13c2a0430e"

# ============================================================
# КОНЕЦ КОНФИГУРАЦИИ
# ============================================================
