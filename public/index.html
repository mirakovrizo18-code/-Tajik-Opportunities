<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🇹🇯 Tajik Opportunities — Единая платформа возможностей</title>
    <meta name="description" content="Работа, образование, торговля, услуги и возможности в Таджикистане" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="manifest" href="/manifest.json" />
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="header-wrapper">
                <div class="logo">
                    <img src="/assets/logo.svg" alt="Tajik Opportunities" class="logo-img" />
                    <span class="logo-text">🇹🇯 Tajik Opportunities</span>
                    <span class="verified-badge">✅</span>
                </div>
                <div class="header-search">
                    <input type="text" id="globalSearch" placeholder="🔎 Поиск по всей платформе..." class="search-input" />
                    <button class="search-btn">Найти</button>
                </div>
                <div class="header-actions">
                    <button class="btn btn-outline" id="createPostBtn">➕ Создать</button>
                    <button class="btn btn-primary" id="adminBtn">Админ</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1 class="hero-title">
                    🇹🇯 <span class="highlight">Tajik Opportunities</span>
                </h1>
                <p class="hero-subtitle">
                    Единая платформа для работы, образования, торговли и возможностей<br />
                    в Таджикистане
                </p>
            </div>
        </section>

        <section class="categories-section">
            <div class="container">
                <h2 class="section-title">📋 Основные категории</h2>
                <div class="categories-grid" id="categoriesGrid"></div>
            </div>
        </section>

        <section class="feed-section">
            <div class="container">
                <div class="feed-header">
                    <h2 class="section-title">🔥 Популярное</h2>
                    <div class="feed-tabs">
                        <button class="tab active" data-tab="popular">🔥 Популярное</button>
                        <button class="tab" data-tab="new">🆕 Новое</button>
                        <button class="tab" data-tab="recommended">⭐ Рекомендуемое</button>
                    </div>
                </div>
                <div class="feed-grid" id="feedGrid"></div>
                <button class="btn btn-load-more" id="loadMoreBtn">Загрузить ещё</button>
            </div>
        </section>
    </main>

    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-page="home">🏠</button>
        <button class="nav-item" data-page="search">🔎</button>
        <button class="nav-item" data-page="create">➕</button>
        <button class="nav-item" data-page="chat">💬</button>
        <button class="nav-item" data-page="menu">☰</button>
    </nav>

    <div class="modal" id="createModal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <h2>➕ Создать публикацию</h2>
            <form id="createForm">
                <select id="categorySelect" required>
                    <option value="">Выберите категорию</option>
                </select>
                <input type="text" id="postTitle" placeholder="Заголовок" required />
                <textarea id="postContent" placeholder="Описание..." rows="5"></textarea>
                <input type="text" id="postCity" placeholder="Город" />
                <button type="submit" class="btn btn-primary">Опубликовать</button>
            </form>
        </div>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
  </html>
